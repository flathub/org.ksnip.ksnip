app-id: org.ksnip.ksnip
runtime: org.kde.Platform
runtime-version: '5.15-25.08'
sdk: org.kde.Sdk
command: ksnip
rename-icon: ksnip
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --filesystem=host
  - --share=network
  - --talk-name=org.freedesktop.Notifications # Enable notification in wayland
  - --talk-name=org.gnome.Shell.Screenshot # Connect wayland screenshot portal
  - --talk-name=org.kde.StatusNotifierWatcher # Tray on KDE
  - --filesystem=/tmp # Copy the screenshots in gnome wayland
cleanup:
  - /include
  - /lib/cmake
  - '*.a'
modules:
  - name: kColorPicker
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_EXAMPLE:BOOL=OFF
      - -DBUILD_TESTS:BOOL=OFF
    sources:
      - type: git
        url: https://github.com/ksnip/kColorPicker.git
        tag: v0.2.0
        commit: 15e16374e51153006d3400cb88066d5272698743

  - name: kImageAnnotator
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_EXAMPLE:BOOL=OFF
      - -DBUILD_TESTS:BOOL=OFF
    sources:
      - type: git
        url: https://github.com/ksnip/kImageAnnotator.git
        tag: v0.6.1
        commit: 997fd557b96ea238e27a15f11b0acf338cfe7db4

  - name: ksnip
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTS:BOOL=OFF
    sources:
      - type: git
        url: https://github.com/ksnip/ksnip.git
        tag: v1.10.1
        commit: ea63a5bf91fbb4d5cc644c7b673af08a0ff847be

